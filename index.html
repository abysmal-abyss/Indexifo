const save=()=>localStorage.setItem('indexio-data',JSON.stringify(data));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const total=d=>d.folders.reduce((n,f)=>n+f.subfolders.reduce((m,s)=>m+s.resources.length,0),0);const getDir=id=>data.find(d=>d.id===id);const getFolder=(d,id)=>d?.folders.find(f=>f.id===id);const getSub=(f,id)=>f?.subfolders.find(s=>s.id===id);const getRes=id=>{for(const d of data)for(const f of d.folders)for(const s of f.subfolders){const r=s.resources.find(x=>x.id===id);if(r)return{r,d,f,s}}};
function crumb(items){return `<div class="crumbs-bar">${items.map((x,i)=>`${i?'<span>›</span>':''}<button class="${i===items.length-1?'current':''}" onclick="${x.action||''}">${esc(x.label)}</button>`).join('')}</div>`}
function topbar(label){return `<div class="topbar"><div class="crumbs"><span>✳</span><span>›</span><span class="current">${label}</span></div><div class="top-actions"><div class="search"><span class="glass">⌕</span><input id="search" placeholder="Search your resources…" value="${esc(state.query)}"><span class="shortcut">⌘ K</span></div><button class="icon-btn" title="Customize background" aria-label="Customize background" onclick="openBackgroundPicker()">◉</button><button class="icon-btn" title="Notifications">♧</button></div></div>`}
function resourceMatches(q){return data.flatMap(d=>d.folders.flatMap(f=>f.subfolders.flatMap(s=>s.resources.filter(r=>(r.title+' '+r.description+' '+r.bullets.join(' ')+' '+(r.tags||[]).join(' ')).toLowerCase().includes(q)).map(r=>({r,d,f,s})))))}
function matchingDirectories(){let q=state.query.trim().toLowerCase();return data.map(d=>({...d,folders:d.folders.filter(f=>!q||f.name.toLowerCase().includes(q)||f.subfolders.some(s=>s.name.toLowerCase().includes(q)||s.resources.some(r=>(r.title+r.description+r.bullets.join(' ')).toLowerCase().includes(q))))})).filter(d=>!q||d.name.toLowerCase().includes(q)||d.folders.length)}
function directoryCards(dirs){return dirs.map((d,i)=>`<article class="directory-card" role="button" tabindex="0" onclick="openDir('${d.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openDir('${d.id}')}"><div class="directory-top"><span class="folder-icon ${d.tone||['mint','lav','peach','yellow'][i%4]}">${esc(d.icon||'▰')}</span><button type="button" class="more" aria-label="Edit directory" onclick="event.stopPropagation();openForm('edit-directory','${d.id}')">···</button></div><h3>${esc(d.name)}</h3><p>${esc(d.description||'A collection of useful resources.')}</p><div class="card-meta"><span class="tiny-dot"></span>${d.folders.length} folders <span>·</span>${total(d)} resources</div></article>`).join('')}
function home(){let q=state.query.trim().toLowerCase(),recent=(recentIds.length?recentIds:data.flatMap(d=>d.folders.flatMap(f=>f.subfolders.flatMap(s=>s.resources.map(r=>r.id))))).slice(0,4).map(getRes).filter(Boolean);return `${topbar('Home')}<section class="heading-row"><div><div class="eyebrow">A little space for everything useful</div><h1>Your library</h1><p>Pick up where you left off, or leave yourself a note.</p></div><button class="primary" onclick="setNav('directories')">Browse directories →</button></section>${q?`<div class="section-head"><h2>Search results</h2></div><section class="panel">${resourceMatches(q).map(({r,d,f,s})=>`<button class="recent-row" onclick="openResource('${r.id}')"><span class="resource-symbol">↗</span><span class="recent-info"><strong>${esc(r.title)}</strong><small>${esc(d.name)} › ${esc(f.name)} › ${esc(s.name)}</small></span></button>`).join('')||`<div class="empty">No resources match that search.</div>`}</section>`:`<div class="stats-grid"><button class="stat-card" onclick="setNav('directories')"><span class="stat-icon">▤</span><span><strong>${data.length}</strong><small>directories</small></span><span class="stat-arrow">→</span></button><div class="stat-card"><span class="stat-icon">↗</span><span><strong>${data.reduce((n,d)=>n+total(d),0)}</strong><small>saved resources</small></span></div><button class="stat-card" onclick="setNav('favorites')"><span class="stat-icon">♡</span><span><strong>${favoriteIds.length}</strong><small>favorites</small></span><span class="stat-arrow">→</span></button></div><div class="lower-grid"><section class="panel"><div class="panel-head"><h2>Recently opened</h2><button class="text-btn" onclick="setNav('recent')">View all →</button></div>${recent.map(({r,d,f,s})=>`<button class="recent-row" onclick="openResource('${r.id}')"><span class="resource-symbol">↗</span><span class="recent-info"><strong>${esc(r.title)}</strong><small>${esc(d.name)} › ${esc(f.name)} › ${esc(s.name)}</small></span><span class="external">↗</span></button>`).join('')||`<div class="empty">Open a resource and it will appear here.</div>`}</section><aside class="panel hint"><span class="hint-icon">✧</span><strong style="color:#dce5dc;font-size:13px">A note to future you</strong><textarea class="note-input" id="note-widget" placeholder="Leave yourself a reminder…">${esc(localStorage.getItem('indexio-note')||'')}</textarea><small class="note-status" id="note-status">Saved in this browser</small></aside></div>`}`}
function directoriesPage(){let dirs=matchingDirectories(),q=state.query.trim().toLowerCase();return `${topbar('Directories')}<section class="heading-row"><div><div class="eyebrow">Browse your collections</div><h1>Directories</h1><p>Choose a directory to explore its folders and resources.</p></div><div style="display:flex;gap:7px;align-items:center"><div class="toggle"><button class="${state.view==='grid'?'on':''}" onclick="setView('grid')" title="Grid view">▦</button><button class="${state.view==='list'?'on':''}" onclick="setView('list')" title="List view">☷</button></div><button class="secondary" onclick="document.getElementById('import-file').click()">Import</button><button class="secondary" onclick="exportData()">Export</button><button class="primary" onclick="openForm('directory')">＋ New directory</button><input id="import-file" type="file" accept="application/json,.json" hidden onchange="importData(this)"></div></section><div class="section-head"><h2>All directories</h2><span>${dirs.length} collections</span></div><div class="directory-grid ${state.view==='list'?'list-view':''}">${dirs.length?directoryCards(dirs):`<div class="empty">${q?'No directories or folders match that search.':'No directories yet. Create one to get started.'}</div>`}</div>${q?`<div class="section-head"><h2>Matching resources</h2></div><section class="panel">${resourceMatches(q).map(({r,d,f,s})=>`<button class="recent-row" onclick="openResource('${r.id}')"><span class="resource-symbol">↗</span><span class="recent-info"><strong>${esc(r.title)}</strong><small>${esc(d.name)} › ${esc(f.name)} › ${esc(s.name)}</small></span></button>`).join('')||`<div class="empty">No matching resources.</div>`}</section>`:''}`}

function openDir(id){state.page='dir';state.nav='directories';state.dir=id;state.folder=null;state.subfolder=null;state.resource=null;render()}function openFolder(id){state.folder=id;state.page='folder';state.expanded.add(id);render()}function openResource(id){state.resource=id;state.page='resource';recentIds=[id,...recentIds.filter(x=>x!==id)].slice(0,20);localStorage.setItem('indexio-recent',JSON.stringify(recentIds));render()}function dirPage(){let d=getDir(state.dir);return `${crumb([{label:'My library',action:"goHome()"},{label:d.name}])}<div class="heading-row"><div class="browser-title"><span class="folder-icon ${d.tone}">${esc(d.icon)}</span><div><h1>${esc(d.name)}</h1><p>${esc(d.description||'Your collection of helpful things.')}</p></div></div><div style="display:flex;gap:8px"><button class="secondary" onclick="openForm('edit-directory','${d.id}')">Edit</button><button class="primary" onclick="openForm('folder','${d.id}')">＋ New folder</button></div></div><div class="section-head"><h2>Folders</h2><span>${d.folders.length} folders</span></div><div class="folder-list">${d.folders.map(f=>`<div class="folder-row"><button class="folder-row-head" onclick="toggleFolder('${f.id}')"><span class="folder-icon ${f.tone||'lav'}">${esc(f.icon||'▰')}</span><span class="row-text"><strong>${esc(f.name)}</strong><small>${f.subfolders.length} ${f.subfolders.length===1?'subfolder':'subfolders'} · ${f.subfolders.reduce((n,s)=>n+s.resources.length,0)} resources</small></span><span class="chevron">›</span></button>${state.expanded.has(f.id)?`<div class="folder-content">${f.subfolders.map(s=>`<button class="subfolder-chip" onclick="event.stopPropagation();openSub('${f.id}','${s.id}')"><span>${esc(s.icon||'▱')}</span>${esc(s.name)}<span style="color:#88968d">${s.resources.length}</span></button>`).join('')}<button class="subfolder-chip" onclick="openForm('subfolder','${d.id}','${f.id}')">＋ Add subfolder</button><button class="subfolder-chip" onclick="openForm('edit-folder','${d.id}','${f.id}')">··· Edit folder</button></div>`:''}</div>`).join('')}</div>`}
function folderPage(){let d=getDir(state.dir),f=getFolder(d,state.folder);return `${crumb([{label:'My library',action:'goHome()'},{label:d.name,action:`openDir('${d.id}')`},{label:f.name}])}<div class="heading-row"><div class="browser-title"><span class="folder-icon ${f.tone||'lav'}">${esc(f.icon||'▰')}</span><div><h1>${esc(f.name)}</h1><p>${esc(f.description||'Folders and resources in this collection.')}</p></div></div><div style="display:flex;gap:8px"><button class="secondary" onclick="openForm('edit-folder','${d.id}','${f.id}')">Edit folder</button><button class="primary" onclick="openForm('subfolder','${d.id}','${f.id}')">＋ New subfolder</button></div></div><div class="section-head"><h2>Subfolders</h2><span>${f.subfolders.length} folders</span></div><div class="directory-grid">${f.subfolders.map(s=>`<article class="directory-card" role="button" tabindex="0" onclick="openSub('${f.id}','${s.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openSub('${f.id}','${s.id}')}"><div class="directory-top"><span class="folder-icon lav">${esc(s.icon||'▱')}</span><button type="button" class="more" aria-label="Edit subfolder" onclick="event.stopPropagation();openForm('edit-subfolder','${d.id}','${f.id}','${s.id}')">···</button></div><h3>${esc(s.name)}</h3><p>Resources in this subfolder</p><div class="card-meta"><span class="tiny-dot"></span>${s.resources.length} resources</div></article>`).join('')||`<div class="empty">No subfolders yet. Create one to get started.</div>`}</div>`}
function openSub(fid,sid){state.folder=fid;state.subfolder=sid;state.page='subfolder';render()}function subPage(){let d=getDir(state.dir),f=getFolder(d,state.folder),s=getSub(f,state.subfolder);return `${crumb([{label:'My library',action:'goHome()'},{label:d.name,action:`openDir('${d.id}')`},{label:f.name,action:`openFolder('${f.id}')`},{label:s.name}])}<div class="heading-row"><div class="browser-title"><span class="folder-icon lav">${esc(s.icon||'▱')}</span><div><h1>${esc(s.name)}</h1><p>Resources in ${esc(f.name)}</p></div></div><button class="primary" onclick="openForm('resource','${d.id}','${f.id}','${s.id}')">＋ New resource</button></div><div class="section-head"><h2>Resources</h2><span>${s.resources.length} saved</span></div><div class="folder-list">${s.resources.length?s.resources.map(r=>`<button class="folder-row-head" style="border:1px solid var(--line);border-radius:13px;background:var(--panel);text-align:left" onclick="openResource('${r.id}')"><span class="resource-symbol">↗</span><span class="row-text"><strong>${esc(r.title)}</strong><small>${esc(r.url)}</small></span><span class="external">↗</span></button>`).join(''):`<div class="empty"><strong>A quiet little corner</strong>Add your first resource here.</div>`}</div>`}
function detail(){let x=getRes(state.resource);if(!x){goHome();return''}let{r,d,f,s}=x;return `${crumb([{label:'My library',action:'goHome()'},{label:d.name,action:`openDir('${d.id}')`},{label:f.name,action:`openFolder('${f.id}')`},{label:s.name,action:`openSub('${f.id}','${s.id}')`},{label:r.title}])}<article class="detail-card"><div class="detail-top"><div class="detail-title"><span class="folder-icon lav">↗</span><div><h1>${esc(r.title)}</h1><p>Saved in ${esc(s.name)}</p></div></div><div class="detail-actions"><button class="icon-btn" title="${favoriteIds.includes(r.id)?'Remove from favorites':'Add to favorites'}" onclick="toggleFavorite('${r.id}')">${favoriteIds.includes(r.id)?'♥':'♡'}</button><button class="secondary" onclick="openForm('edit-resource','${r.id}')">Edit</button><button class="icon-btn" onclick="removeResource('${r.id}')" title="Remove resource">⌫</button></div></div><a class="detail-link" href="${esc(r.url)}" target="_blank" rel="noopener">Open resource <span>↗</span></a><div class="detail-copy"><div>${esc(r.description||'No description yet.')}</div><h3>Quick notes</h3><ul>${(r.bullets||[]).map(b=>`<li>${esc(b)}</li>`).join('')}</ul><div>${(r.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div></article>`}
function collectionPage(kind){let ids=kind==='recent'?recentIds:favoriteIds,items=ids.map(getRes).filter(Boolean),title=kind==='recent'?'Recently opened':'Favorites',icon=kind==='recent'?'◷':'♡';return `${crumb([{label:'My library',action:'goHome()'},{label:title}])}<div class="heading-row"><div><div class="eyebrow">Your personal library</div><h1>${title}</h1><p>${kind==='recent'?'Pick up where you left off.':'Resources you marked as favorites.'}</p></div></div><div class="folder-list">${items.length?items.map(({r,d,f,s})=>kind==='favorites'?`<div class="favorite-row"><button class="folder-row-head" onclick="openResource('${r.id}')"><span class="resource-symbol">${icon}</span><span class="row-text"><strong>${esc(r.title)}</strong><small>${esc(d.name)} › ${esc(f.name)} › ${esc(s.name)}</small></span><span class="external">↗</span></button><button class="icon-btn remove-favorite" title="Remove from favorites" aria-label="Remove ${esc(r.title)} from favorites" onclick="toggleFavorite('${r.id}')">♥</button></div>`:`<button class="folder-row-head" style="border:1px solid var(--line);border-radius:13px;background:var(--panel);text-align:left" onclick="openResource('${r.id}')"><span class="resource-symbol">${icon}</span><span class="row-text"><strong>${esc(r.title)}</strong><small>${esc(d.name)} › ${esc(f.name)} › ${esc(s.name)}</small></span><span class="external">↗</span></button>`).join(''):`<div class="empty"><strong>${kind==='recent'?'Nothing opened yet':'No favorites yet'}</strong>${kind==='recent'?'Open a resource and it will show up here.':'Tap the heart on a resource to save it here.'}</div>`}</div>`}
function setNav(nav){state.nav=nav;state.dir=null;state.folder=null;state.subfolder=null;state.resource=null;if(nav==='appearance'){state.page='home';openBackgroundPicker()}else if(nav==='recent'||nav==='favorites'||nav==='directories')state.page=nav;else state.page='home';render()}function toggleFavorite(id){favoriteIds=favoriteIds.includes(id)?favoriteIds.filter(x=>x!==id):[id,...favoriteIds];localStorage.setItem('indexio-favorites',JSON.stringify(favoriteIds));render();if(state.page==='resource')showToast(favoriteIds.includes(id)?'Added to favorites':'Removed from favorites')}
function render(){let main=document.getElementById('main');main.innerHTML=state.page==='home'?home():state.page==='directories'?directoriesPage():state.page==='recent'||state.page==='favorites'?collectionPage(state.page):state.page==='dir'?dirPage():state.page==='folder'?folderPage():state.page==='subfolder'?subPage():detail();if(state.page==='dir'){let d=getDir(state.dir),h=main.querySelector('.section-head'),list=main.querySelector('.folder-list');if(h)h.innerHTML=`<h2>Folders</h2><div style="display:flex;align-items:center;gap:10px"><span>${d.folders.length} folders</span><div class="toggle"><button class="${state.folderView==='grid'?'on':''}" onclick="setFolderView('grid')" title="Grid view">▦</button><button class="${state.folderView==='list'?'on':''}" onclick="setFolderView('list')" title="List view">☷</button></div></div>`;if(state.folderView==='grid'&&list){list.className='directory-grid';list.innerHTML=d.folders.map(f=>`<button class="directory-card" onclick="openFolder('${f.id}')"><div class="directory-top"><span class="folder-icon ${f.tone||'lav'}">${esc(f.icon||'▰')}</span><span class="more">›</span></div><h3>${esc(f.name)}</h3><p>${esc(f.description||'Folders and resources')}</p><div class="card-meta"><span class="tiny-dot"></span>${f.subfolders.length} subfolders <span>·</span>${f.subfolders.reduce((n,s)=>n+s.resources.length,0)} resources</div></button>`).join('')||`<div class="empty">No folders yet. Create one to get started.</div>`}}main.querySelector('#note-widget')?.addEventListener('input',e=>{localStorage.setItem('indexio-note',e.target.value);let status=main.querySelector('#note-status');if(status)status.textContent='Saved just now'});main.querySelector('#search')?.addEventListener('input',e=>{state.query=e.target.value;const pos=e.target.selectionStart;render();let input=document.getElementById('search');input.focus();input.setSelectionRange(pos,pos)});document.querySelectorAll('.nav-item[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.nav))}function goHome(){state.page='home';state.nav='home';state.dir=null;state.folder=null;state.subfolder=null;state.resource=null;render()}function setView(v){state.view=v;render()}function setFolderView(v){state.folderView=v;render()}function toggleFolder(id){state.expanded.has(id)?state.expanded.delete(id):state.expanded.add(id);render()}
function openForm(type,a,b,c){let title='',fields='',saveFn='',deleteFn='';if(type==='directory'||type==='edit-directory'){let d=type==='edit-directory'?getDir(a):{};title=type==='directory'?'New directory':'Edit directory';fields=`<div class="field"><label>Name</label><input id="f-name" value="${esc(d.name||'')}" placeholder="e.g. Learning & ideas"></div><div class="field"><label>Icon (emoji or symbol)</label><input id="f-icon" value="${esc(d.icon||'✳')}" maxlength="4"></div><div class="field"><label>Short description</label><input id="f-desc" value="${esc(d.description||'')}" placeholder="What belongs here?"></div>`;saveFn=`saveDirectory('${type}','${a||''}')`;if(type==='edit-directory')deleteFn=`removeItem('directory','${a}')`}
else if(type==='folder'||type==='edit-folder'){let f=type==='edit-folder'?getFolder(getDir(a),b):{};title=type==='folder'?'New folder':'Edit folder';fields=`<div class="field"><label>Name</label><input id="f-name" value="${esc(f.name||'')}" placeholder="e.g. Frontend"></div><div class="field"><label>Icon</label><input id="f-icon" value="${esc(f.icon||'▰')}" maxlength="4"></div><div class="field"><label>Description</label><input id="f-desc" value="${esc(f.description||'')}" placeholder="A short note about this folder"></div>`;saveFn=`saveFolder('${type}','${a}','${b||''}')`;if(type==='edit-folder')deleteFn=`removeItem('folder','${a}','${b}')`}
else if(type==='subfolder'||type==='edit-subfolder'){let sub=type==='edit-subfolder'?getSub(getFolder(getDir(a),b),c):{};title=type==='subfolder'?'New subfolder':'Edit subfolder';fields=`<div class="field"><label>Name</label><input id="f-name" value="${esc(sub.name||'')}" placeholder="e.g. Design references"></div><div class="field"><label>Icon</label><input id="f-icon" value="${esc(sub.icon||'▱')}" maxlength="4"></div>`;saveFn=type==='subfolder'?`saveSubfolder('${a}','${b}')`:`saveSubfolder('${a}','${b}','${c}')`;if(type==='edit-subfolder')deleteFn=`removeItem('subfolder','${a}','${b}','${c}')`}
else{let old=null,ctx={d:a,f:b,s:c};if(type==='edit-resource'){old=getRes(a)?.r;ctx=getRes(a)||{}}title=old?'Edit resource':'New resource';fields=`<div class="field"><label>Title</label><input id="f-title" value="${esc(old?.title||'')}" placeholder="Resource name"></div><div class="field"><label>Link</label><input id="f-url" value="${esc(old?.url||'')}" placeholder="https://"></div><div class="field"><label>Description</label><textarea id="f-desc" placeholder="What is it, and when is it useful?">${esc(old?.description||'')}</textarea></div><div class="field"><label>Bullet notes — one per line</label><textarea id="f-bullets" placeholder="What to remember\nHow to use it">${esc((old?.bullets||[]).join('\n'))}</textarea></div><div class="field"><label>Tags — comma separated</label><input id="f-tags" value="${esc((old?.tags||[]).join(', '))}" placeholder="design, reference"></div>`;saveFn=old?`saveResource('edit','${old.id}')`:`saveResource('new','${a}','${b}','${c}')`}
document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modal-head"><h2>${title}</h2><button class="icon-btn" onclick="closeModal()">×</button></div><form class="form" onsubmit="event.preventDefault();${saveFn}">${fields}<div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button>${deleteFn?`<button type="button" class="secondary" style="margin-right:auto;color:#e8aaa5" onclick="${deleteFn}">Delete</button>`:''}<button class="primary">Save</button></div></form></section></div>`;setTimeout(()=>document.querySelector('.modal input')?.focus(),20)}
function val(id){return document.getElementById(id)?.value.trim()||''}function closeModal(){document.getElementById('modal-root').innerHTML=''}function saveDirectory(type,id){let name=val('f-name');if(!name)return;if(type==='directory')data.push({id:crypto.randomUUID(),name,icon:val('f-icon')||'✳',tone:'mint',description:val('f-desc'),folders:[]});else Object.assign(getDir(id),{name,icon:val('f-icon')||'✳',description:val('f-desc')});save();closeModal();render();showToast('Directory saved')}
function saveFolder(type,did,fid){let f={name:val('f-name'),icon:val('f-icon')||'▰',tone:'lav',description:val('f-desc')};if(!f.name)return;let d=getDir(did);if(type==='folder')d.folders.push({id:crypto.randomUUID(),...f,subfolders:[]});else Object.assign(getFolder(d,fid),f);save();closeModal();render();showToast('Folder saved')}
function saveSubfolder(did,fid,sid){let name=val('f-name');if(!name)return;let f=getFolder(getDir(did),fid);if(sid)Object.assign(getSub(f,sid),{name,icon:val('f-icon')||'▱'});else f.subfolders.push({id:crypto.randomUUID(),name,icon:val('f-icon')||'▱',resources:[]});save();closeModal();render();showToast(sid?'Subfolder updated':'Subfolder created')}
function saveResource(mode,...args){let r={id:mode==='edit'?args[0]:crypto.randomUUID(),title:val('f-title'),url:val('f-url'),description:val('f-desc'),bullets:val('f-bullets').split('\n').map(x=>x.trim()).filter(Boolean),tags:val('f-tags').split(',').map(x=>x.trim()).filter(Boolean)};if(!r.title)return;if(mode==='edit'){let x=getRes(r.id);Object.assign(x.r,r)}else getSub(getFolder(getDir(args[0]),args[1]),args[2]).resources.push(r);save();closeModal();render();showToast('Resource saved')}
function removeResource(id){if(!confirm('Remove this resource from your library?'))return;let x=getRes(id);x.s.resources=x.s.resources.filter(r=>r.id!==id);state.page='subfolder';state.subfolder=x.s.id;save();render();showToast('Resource removed')}function removeItem(kind,did,fid,sid){if(!confirm(`Remove this ${kind} and everything inside it?`))return;if(kind==='subfolder'){let d=getDir(did),f=getFolder(d,fid);f.subfolders=f.subfolders.filter(s=>s.id!==sid);state.page='folder';state.folder=fid}else if(kind==='folder'){let d=getDir(did);d.folders=d.folders.filter(f=>f.id!==fid);state.page='dir'}else if(kind==='directory'){data=data.filter(d=>d.id!==did);state.page='home'}save();closeModal();render();showToast(`${kind[0].toUpperCase()+kind.slice(1)} removed`)}
let activeGradient=Math.max(0,Math.min(9,Number(localStorage.getItem('indexio-background')||0)));
function applyBackground(index){activeGradient=index;document.documentElement.style.setProperty('--wallpaper',gradients[index][1]);localStorage.setItem('indexio-background',String(index));showToast(`${gradients[index][0]} background selected`)}
function openWorkspaceMenu(){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal" style="width:min(360px,100%)"><div class="modal-head"><h2>Workspace</h2><button class="icon-btn" onclick="closeModal()">×</button></div><div class="folder-list"><button class="folder-row-head" onclick="closeModal();openForm('directory')">＋ <span class="row-text"><strong>New directory</strong><small>Add a collection</small></span></button><button class="folder-row-head" onclick="closeModal();exportData()">⇩ <span class="row-text"><strong>Export library</strong><small>Download all directories</small></span></button><button class="folder-row-head" onclick="openProfileSettings()">◉ <span class="row-text"><strong>Customize profile</strong><small>Change your name and picture</small></span></button></div></section></div>`}function updateProfilePreview(){let preview=document.getElementById('profile-preview');if(!preview)return;preview.innerHTML=profileDraftImage?`<img src="${esc(profileDraftImage)}" alt="Profile picture preview">`:esc((document.getElementById('profile-name-input')?.value||profile.name||'M').trim().slice(0,1).toUpperCase())}function loadProfileImage(input){let file=input.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){showToast('Choose an image file');input.value='';return}if(file.size>2*1024*1024){showToast('Choose an image under 2 MB');input.value='';return}let reader=new FileReader();reader.onload=()=>{profileDraftImage=reader.result;updateProfilePreview()};reader.readAsDataURL(file)}function openProfileSettings(){profileDraftImage=profile.image||'';document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modal-head"><h2>Customize profile</h2><button class="icon-btn" onclick="closeModal()">×</button></div><form class="form" onsubmit="event.preventDefault();saveProfile()"><div style="display:flex;align-items:center;gap:15px;margin-bottom:4px"><div class="avatar profile-preview" id="profile-preview">${profileDraftImage?`<img src="${esc(profileDraftImage)}" alt="Profile picture preview">`:esc((profile.name||'M').slice(0,1).toUpperCase())}</div><div class="field" style="flex:1"><label for="profile-image">Profile picture</label><input id="profile-image" type="file" accept="image/*" onchange="loadProfileImage(this)"></div></div><div class="field"><label for="profile-name-input">Display name</label><input id="profile-name-input" maxlength="40" value="${esc(profile.name)}" placeholder="Your name" oninput="updateProfilePreview()"></div><div class="field"><label for="profile-subtitle-input">Subtitle</label><input id="profile-subtitle-input" maxlength="60" value="${esc(profile.subtitle)}" placeholder="A short line about you"></div><p class="hint" style="margin:0">Your profile picture is saved only in this browser.</p><div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">Save profile</button></div></form></section></div>`}function saveProfile(){let name=document.getElementById('profile-name-input').value.trim();if(!name){showToast('Add a display name first');return}profile={name,subtitle:document.getElementById('profile-subtitle-input').value.trim()||'Personal workspace',image:profileDraftImage};localStorage.setItem('indexio-profile',JSON.stringify(profile));document.getElementById('profile-name').textContent=profile.name;document.getElementById('profile-subtitle').textContent=profile.subtitle;let avatar=document.getElementById('profile-avatar');avatar.innerHTML=profile.image?`<img src="${esc(profile.image)}" alt="">`:esc(profile.name.slice(0,1).toUpperCase());closeModal();showToast('Profile updated')}function openBackgroundPicker(){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modal-head"><h2>Choose a background</h2><button class="icon-btn" onclick="closeModal()">×</button></div><p class="hint" style="margin:0 0 15px">Ten quiet gradients, all tuned for the dark theme.</p><div class="gradient-grid">${gradients.map((g,i)=>`<button class="gradient-option ${i===activeGradient?'selected':''}" onclick="applyBackground(${i});openBackgroundPicker()"><div class="gradient-swatch" style="background:${g[1]}"></div><span>${g[0]}</span></button>`).join('')}</div><div class="modal-actions"><button class="primary" onclick="closeModal()">Done</button></div></section></div>`}
function exportData(id){let payload=id?getDir(id):data;let name=id?getDir(id).name.replace(/[^a-z0-9]+/gi,'-').toLowerCase():'indexio-library';let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${name}.json`;a.click();URL.revokeObjectURL(a.href);showToast('Export ready')}
function importData(input){let file=input.files?.[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let value=JSON.parse(reader.result),items=Array.isArray(value)?value:[value];if(!items.length||items.some(x=>typeof x.name!=='string'||!Array.isArray(x.folders)))throw new Error();data.push(...items);save();render();showToast(`${items.length} ${items.length===1?'directory':'directories'} imported`)}catch{showToast('That file is not an Indexio directory export')}input.value=''};reader.readAsText(file)}
function showToast(msg){document.getElementById('toast-root').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>document.getElementById('toast-root').innerHTML='',2200)}
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('search')?.focus()}if(e.key==='Escape')closeModal()});document.documentElement.style.setProperty('--wallpaper',gradients[activeGradient][1]);render();
</script>
</body>
</html>
